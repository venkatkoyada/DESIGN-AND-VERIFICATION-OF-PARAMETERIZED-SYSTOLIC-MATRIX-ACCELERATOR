// cm_hier.cfg — VCS coverage hierarchy exclusion file
// Passed to VCS via -cm_hier cm_hier.cfg in VCS_FLAGS.
//
// Purpose: exclude VCS-internal UVM library modules from code coverage
// collection so they don't appear in the report and drag down the score.
//
// uvm_custom_install_recording       : VCS auto-injected UVM transaction
//                                      recording infrastructure module.
// uvm_custom_install_verdi_recording : VCS auto-injected Verdi waveform
//                                      integration module for UVM.
//
// Both are compiled as part of -ntb_opts uvm-1.1; they are NOT part of
// the DUT or the testbench and must not count toward coverage goals.
//
// Syntax: -tree <instance_name>  excludes the named instance and all
// of its children from code coverage collection.

-tree uvm_custom_install_recording
-tree uvm_custom_install_verdi_recording
